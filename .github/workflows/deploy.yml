# Deploys the API to the EC2 server on every push to main.
# Copies the code over SSH, then runs deploy/setup.sh, which installs packages,
# restarts the service, updates nginx and checks the API answers.
# The server's .env is never touched: it isn't in the repo.
name: Deploy API

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time; a newer push waits for the current one.
concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Copy code to the server
        run: |
          rsync -az --exclude .git --exclude .github --exclude .venv --exclude __pycache__ \
            -e "ssh -i ~/.ssh/deploy_key" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:~/flightpulse-api/"

      - name: Install and restart
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            'bash ~/flightpulse-api/deploy/setup.sh'
