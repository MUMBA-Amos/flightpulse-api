# FlightPulse API server. The website is hosted on Vercel, which proxies
# /api/* here; this server only serves the API.

# Requests arrive through Vercel, so rate-limit by the visitor's IP from
# X-Forwarded-For rather than Vercel's own address.
map $http_x_forwarded_for $client_ip {
    "~^(?<first>[^,\s]+)" $first;
    default               $remote_addr;
}

# General API traffic. A page load makes ~5 calls, plus weather lookups.
limit_req_zone $client_ip zone=api:10m rate=10r/s;
# Endpoints that call outside services (Aviation Weather Center, adsbdb),
# including the flight-sim briefing.
# The weather page asks for every airport in the day's flights at once (~100),
# hence the large bursts.
limit_req_zone $client_ip zone=external:10m rate=60r/m;

log_format flightpulse '$client_ip [$time_local] "$request" $status $body_bytes_sent $request_time';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/flightpulse.log flightpulse;

    limit_req_status 429;

    location ~ ^/api/(weather|aircraft/route|sim)/ {
        limit_req zone=api burst=200 nodelay;
        limit_req zone=external burst=200 nodelay;
        include /etc/nginx/flightpulse-proxy.conf;
    }

    location /api/ {
        limit_req zone=api burst=100 nodelay;
        include /etc/nginx/flightpulse-proxy.conf;
    }

    # Anyone opening the bare server address is sent to the website.
    location = / {
        return 302 https://flightpulse-frontend.vercel.app;
    }

    location / {
        return 404;
    }
}
